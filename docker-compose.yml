version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Backend + React SPA ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bigip-protocol-tuner:latest
    container_name: bigip-tuner-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
      TUNER_CONFIG_DIR: "/config"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
      VICTORIAMETRICS_URL: "http://victoriametrics:8428"
      VICTORIAMETRICS_DATA_PATH: "/victoria-metrics-data"
      GRAFANA_INTERNAL_URL: "http://grafana:3000"
      GRAFANA_EXTERNAL_URL: "${GRAFANA_EXTERNAL_URL:-http://localhost:3000}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      VM_RETENTION_PERIOD: "${VM_RETENTION_PERIOD:-30d}"
      VM_MAX_STORAGE_GB: "${VM_MAX_STORAGE_GB:-10.0}"
      TELEMETRY_POLL_INTERVAL_SECONDS: "${TELEMETRY_POLL_INTERVAL_SECONDS:-30}"
      # Set BIGIP_SESSION_ENCRYPTION_KEY to a base64-url Fernet key to override auto-generated key
    volumes:
      - tuner-config:/config
    depends_on:
      otel-collector:
        condition: service_started
      victoriametrics:
        condition: service_healthy
    networks:
      - tuner-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── OpenTelemetry Collector ──────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: bigip-tuner-otel
    restart: unless-stopped
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC (optional)
      - "13133:13133" # Health check extension
    networks:
      - tuner-net
    logging: *default-logging

  # ── VictoriaMetrics ─────────────────────────────────────────────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    container_name: bigip-tuner-vm
    restart: unless-stopped
    entrypoint: ["/entrypoint-wrapper.sh"]
    environment:
      VM_RETENTION_PERIOD: "${VM_RETENTION_PERIOD:-30d}"
      VM_DEDUP_INTERVAL: "${VM_DEDUP_INTERVAL:-15s}"
      VM_MAX_STORAGE_GB: "${VM_MAX_STORAGE_GB:-10.0}"
    volumes:
      - vm-data:/victoria-metrics-data
      - ./victoriametrics/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - tuner-config:/config:ro
    ports:
      - "8428:8428"
    networks:
      - tuner-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/-/healthy"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: bigip-tuner-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_EXTERNAL_URL:-http://localhost:3000}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "10s"
      GF_RENDERING_SERVER_URL: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - tuner-net
    depends_on:
      victoriametrics:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tuner-config:
  vm-data:
  grafana-data:

networks:
  tuner-net:
    driver: bridge
