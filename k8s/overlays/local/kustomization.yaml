apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: bigip-tuner

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: bigip-tuner-backend

configMapGenerator:
  - name: tuner-env
    literals:
      - GRAFANA_EXTERNAL_URL=http://localhost:3000

secretGenerator:
  - name: tuner-secrets
    literals:
      - GF_SECURITY_ADMIN_PASSWORD=admin
