apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: bigip-tuner

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Minimal: scale down Grafana to free resources; use external Grafana if available
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: grafana

configMapGenerator:
  - name: tuner-env
    literals:
      - GRAFANA_EXTERNAL_URL=http://localhost:3000

secretGenerator:
  - name: tuner-secrets
    literals:
      - GF_SECURITY_ADMIN_PASSWORD=admin
