apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: bigip-tuner
spec:
  host: grafana-bigip-tuner.apps.example.com
  to:
    kind: Service
    name: grafana
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
