apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - route-backend.yaml
  - route-grafana.yaml

namespace: bigip-tuner

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Drop explicit runAsUser — OpenShift assigns an arbitrary UID from the project's range
  - patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
    target:
      kind: Deployment

  # Backend: allow arbitrary GID 0 for /config group-write access
  - patch: |-
      - op: replace
        path: /spec/template/spec/securityContext/fsGroup
        value: 0
    target:
      kind: Deployment
      name: bigip-tuner-backend

  # VictoriaMetrics: fsGroup 0 for data volume
  - patch: |-
      - op: replace
        path: /spec/template/spec/securityContext/fsGroup
        value: 0
    target:
      kind: Deployment
      name: victoriametrics

  # Grafana: fsGroup 0 for data volume
  - patch: |-
      - op: replace
        path: /spec/template/spec/securityContext/fsGroup
        value: 0
    target:
      kind: Deployment
      name: grafana

configMapGenerator:
  - name: tuner-env
    literals:
      - GRAFANA_EXTERNAL_URL=https://grafana-bigip-tuner.apps.example.com

secretGenerator:
  - name: tuner-secrets
    literals:
      - GF_SECURITY_ADMIN_PASSWORD=changeme
