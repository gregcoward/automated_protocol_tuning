apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bigip-tuner
spec:
  selector:
    app: bigip-tuner-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: bigip-tuner
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: bigip-tuner
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: bigip-tuner
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
