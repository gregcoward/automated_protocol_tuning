apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuner-config-pvc
  namespace: bigip-tuner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-data-pvc
  namespace: bigip-tuner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: bigip-tuner
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
