apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: bigip-tuner
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.106.1
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=30d
            - -dedup.minScrapeInterval=15s
            - -httpListenAddr=:8428
            - -search.maxQueryDuration=60s
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: vm-data
              mountPath: /victoria-metrics-data
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 8428
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: vm-data
          persistentVolumeClaim:
            claimName: vm-data-pvc
